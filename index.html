<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Booth">
<meta name="theme-color" content="#050b1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Party Machines Booth</title>
<style>
:root{
  --bg:#050b1f; --panel:#0d1838; --panel2:#15244d; --line:rgba(150,190,255,.15);
  --text:#f3f6ff; --mut:#93a3c9; --accent:#ffd21f; --blue:#2f7bff; --blue-soft:#cfe0ff; --ink:#1a1400; --red:#ff5d6c; --ok:#46e08a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select,button,textarea{font:inherit;color:inherit}
input[type=text],input[type=email],input[type=tel],input[type=password],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;-webkit-user-select:text;user-select:text}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.hidden{display:none!important}

.screen{position:fixed;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 28px)}
.screen.active{display:block}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

h1{font-size:26px;margin:0;letter-spacing:-.01em}
h2{font-size:13px;margin:10px 0 0;color:var(--mut);text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.sub{color:var(--mut);font-size:14px}
.top{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:12px;flex:none}
.back{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:rgba(47,123,255,.22);border:1px solid rgba(120,170,255,.35);color:var(--blue-soft);font-weight:700;font-size:15px;padding:9px 16px 9px 12px;border-radius:99px;cursor:pointer}
.back:active{filter:brightness(1.3)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.live{border-color:rgba(47,123,255,.6);background:linear-gradient(160deg,rgba(47,123,255,.2),var(--panel) 55%)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 10px;border-radius:99px;background:var(--accent);color:var(--ink);align-self:flex-start}
.pill.off{background:var(--panel2);color:var(--mut)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;border:0;
  font-weight:700;padding:0 18px;background:var(--panel2);color:var(--text);cursor:pointer;width:100%;text-align:center}
.btn:active{transform:scale(.985);filter:brightness(1.15)}
.btn.primary{background:var(--accent);color:var(--ink)}
.btn.danger{color:var(--red)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}
.row>*{flex:1}
.list-item{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.list-item .grow{flex:1;min-width:0}
.list-item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* settings */
.set{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .lab{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.set .lab output{color:var(--accent);font-weight:700}
.set .hint{font-size:12.5px;color:var(--mut)}
.set.inline{flex-direction:row;align-items:center;justify-content:space-between}
.filebtn{display:flex;gap:10px;align-items:center}
.filebtn img{height:44px;max-width:90px;object-fit:contain;background:var(--panel2);border-radius:8px}

/* clip grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumb{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:var(--panel2);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb span{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;background:rgba(0,0,0,.6);padding:2px 7px;border-radius:99px}

/* ---------- booth ---------- */
.screen.booth{padding:0;overflow:hidden;background:#000}
#frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;height:100%;overflow:hidden;background:#000}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#cam.mirror{transform:scaleX(-1)}
#boothBorder{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.bback{position:absolute;left:14px;top:calc(env(safe-area-inset-top) + 12px);z-index:5;background:rgba(5,11,31,.7);backdrop-filter:blur(6px)}
#b-info{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 16px);z-index:4;font:600 11px ui-monospace,Menlo,monospace;color:rgba(255,255,255,.75);background:rgba(5,11,31,.6);padding:4px 8px;border-radius:8px;pointer-events:none}
#b-cdlabel{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 70px);text-align:center;font-weight:800;font-size:18px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:0 8% calc(env(safe-area-inset-bottom) + 40px)}
.rings{display:none;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.rings i{position:absolute;width:42vw;height:42vw;max-width:260px;max-height:260px;border-radius:50%;border:2px solid rgba(255,255,255,.4);animation:sonar 2.2s ease-out infinite}
.rings i:nth-child(2){animation-delay:1.1s}
@keyframes sonar{from{transform:scale(1);opacity:.55}to{transform:scale(2.6);opacity:0}}
.hero{font-weight:900;font-size:clamp(34px,11vw,52px);letter-spacing:.02em;text-shadow:0 2px 18px rgba(0,0,0,.7);text-align:center;line-height:1.05}
.hero small{display:block;font-size:15px;letter-spacing:.02em;font-weight:600;opacity:.8;margin-top:8px}
.meter{width:200px;height:6px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden;margin:18px 0 8px}
.meter i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px}
.meter.hot i{background:var(--red)}
.tapbtn{width:100%;margin-top:18px;min-height:68px;border-radius:99px;border:0;background:var(--accent);color:var(--ink);font-weight:900;font-size:21px;letter-spacing:.08em}
#b-count{background:rgba(0,0,0,.22);align-items:center;justify-content:center;padding:0}
.ringwrap{position:relative;width:min(62vw,300px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.ringwrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringwrap circle{fill:none;stroke-width:7}
.ringwrap .bg{stroke:rgba(255,255,255,.18)}
.ringwrap .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.num{font-weight:900;font-size:clamp(80px,26vw,140px);line-height:1}
.num.pop{animation:pop .32s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
#b-rec{justify-content:space-between;padding-top:calc(env(safe-area-inset-top) + 56px);pointer-events:none}
.recpill{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.55);padding:8px 14px;border-radius:99px;font:700 14px ui-monospace,Menlo,monospace;letter-spacing:.1em}
.recpill i{width:11px;height:11px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.bar{width:100%;height:6px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red)}
#b-proc{background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:0;gap:18px}
#b-proc .ringwrap{width:92px}
#b-proc .num{font-size:20px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s ease-out}
#hot{position:absolute;left:0;top:0;width:72px;height:72px}
#b-resume{background:rgba(0,0,0,.82);align-items:center;justify-content:center;padding:0 10%;gap:16px;text-align:center}

/* review */
video.player{width:100%;max-height:52vh;aspect-ratio:9/16;object-fit:contain;background:#000;border-radius:20px}
.lead label{font-size:13px;color:var(--mut)}

/* pin */
#pin{position:fixed;inset:0;background:rgba(9,9,15,.97);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
#pin.show{display:flex}
.dots{display:flex;gap:16px;margin:6px 0 8px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mut)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:76px;border-radius:50%;border:0;background:var(--panel2);font-size:28px;font-weight:600}
.pad button:active{background:var(--accent);color:var(--ink)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-30px);opacity:0;
  background:#fff;color:#111;padding:12px 18px;border-radius:99px;font-weight:700;z-index:80;transition:.25s;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.modal.show{display:flex}

.welcome{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 0 6px;text-align:center}
.welcome .mark{width:84px;height:84px;border-radius:22px;margin-bottom:8px}
.welcome h1{font-size:40px}
.btn.big{min-height:66px;font-size:19px;border-radius:20px}
.home{min-height:calc(100vh - 60px)}
.spacer{flex:1}
details.past{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:2px 14px 14px}
details.past summary{list-style:none;cursor:pointer;padding:14px 2px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
details.past summary::-webkit-details-marker{display:none}
details.past summary::after{content:'▾';color:var(--accent);font-size:18px}
details.past[open] summary::after{content:'▴'}
details.past .list-item{margin-top:8px;background:var(--panel2)}
.chk{display:flex;gap:10px;align-items:center;font-size:14px}
.field label{display:block;font-size:13px;color:var(--mut);margin:2px 0 6px}
#b-status{background:rgba(255,77,94,.16);border:1px solid rgba(255,77,94,.5);color:#ffd5d9;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4;text-align:left;width:100%}
.tapbtn.alt{display:flex;align-items:center;justify-content:center;background:transparent;color:#fff;border:2px solid rgba(255,255,255,.5);font-size:16px;letter-spacing:.02em;min-height:56px;text-align:center;padding:0 14px}
@media (prefers-reduced-motion:reduce){.rings i,.recpill i{animation:none}}
</style>
</head>
<body>

<!-- ===== HOME ===== -->
<section id="s-home" class="screen active"><div class="wrap home">
  <div class="welcome"><img class="mark" src="icon-192.png" alt=""><h1>Welcome</h1><div class="sub">Party Machines Booth</div></div>
  <div id="h-resume"></div>
  <button class="btn primary big" id="h-new">Start new event</button>
  <button class="btn ghost" id="h-defaults">Default settings &amp; PIN</button>
  <div class="spacer"></div>
  <details class="past" id="h-past" open>
    <summary><span>Past events <span class="sub" id="h-count"></span></span></summary>
    <div id="h-list"></div>
  </details>
  <div class="sub" id="h-storage"></div>
  <div class="sub" id="h-install"></div>
  <div class="sub" style="display:flex;gap:10px;align-items:center;justify-content:space-between"><span id="h-ver"></span><button class="back" id="h-update" style="padding:6px 12px;font-size:13px">Update app</button></div>
</div></section>

<!-- ===== SETTINGS FORM (new event / event settings / defaults) ===== -->
<section id="s-form" class="screen"><div class="wrap">
  <button class="back" id="f-back">‹ Back</button>
  <h1 id="f-title"></h1>
  <div id="f-top"></div>
  <div id="f-body"></div>
  <div id="f-pin" class="hidden"></div>
  <button class="btn primary big" id="f-save">Save</button>
</div></section>

<!-- ===== EVENT HUB ===== -->
<section id="s-hub" class="screen"><div class="wrap">
  <button class="back" data-go="home">‹ Home</button>
  <h1 id="hub-title">Event</h1>
  <div class="sub" id="hub-sub"></div>
  <button class="btn primary big" id="hub-record">● Start recording</button>
  <button class="btn big" id="hub-videos">Videos <span id="hub-count" class="sub"></span></button>
  <div class="card">
    <h2 style="margin:0">This event</h2>
    <button class="btn" id="hub-settings">Event settings</button>
    <button class="btn" id="hub-copy">Copy settings to a new event</button>
    <button class="btn" id="hub-rename">Rename</button>
    <button class="btn danger" id="hub-delete">Delete event</button>
  </div>
</div></section>

<!-- ===== VIDEOS ===== -->
<section id="s-videos" class="screen"><div class="wrap">
  <button class="back" id="v-back">‹ Event</button>
  <h1 id="ev-title">Videos</h1>
  <div class="sub" id="ev-sub"></div>
  <div class="card" id="ev-actions"></div>
  <div class="card">
    <h2 style="margin:0">Highlight reel</h2>
    <div class="sub">Every video from the event stitched into one, under your music.</div>
    <div id="ev-reel" style="display:flex;flex-direction:column;gap:10px"></div>
  </div>
  <div class="grid" id="ev-grid"></div>
</div></section>

<!-- ===== BOOTH ===== -->
<section id="s-booth" class="screen booth">
  <div id="frame"><video id="cam" playsinline muted autoplay></video><img id="boothBorder" alt="" class="hidden"></div>
  <button class="back bback hidden" id="b-back">‹ Back</button>
  <div id="b-info"></div>
  <div id="b-wait" class="layer">
    <div class="rings"><i></i><i></i></div>
    <div class="hero" id="b-hero">SPIN THE RIG<small>or tap to start</small></div>
    <div class="meter" id="b-meter"><i></i></div>
    <button class="tapbtn" id="b-tap">TAP TO START</button>
  </div>
  <div id="b-count" class="layer hidden">
    <div class="ringwrap"><svg viewBox="0 0 200 200"><circle class="bg" cx="100" cy="100" r="90"/><circle class="fg" id="b-ring" cx="100" cy="100" r="90"/></svg><div class="num" id="b-num">3</div></div>
    <div id="b-cdlabel"></div>
  </div>
  <div id="b-rec" class="layer hidden">
    <div class="recpill"><i></i>REC</div>
    <div class="bar"><i id="b-recbar"></i></div>
  </div>
  <div id="b-proc" class="layer hidden">
    <div class="ringwrap"><svg viewBox="0 0 200 200"><circle class="bg" cx="100" cy="100" r="90"/><circle class="fg" id="p-ring" cx="100" cy="100" r="90" style="transition:none"/></svg><div class="num" id="p-num">0%</div></div>
    <div style="font-weight:700">Working on it…</div>
  </div>
  <div id="b-resume" class="layer hidden">
    <img class="mark" src="icon-192.png" alt="" style="width:72px;height:72px;border-radius:18px">
    <div class="hero" style="font-size:30px"><span id="b-evname">Booth</span><small>Tap to switch the camera on</small></div>
    <div id="b-status" class="hidden"></div>
    <button class="tapbtn" id="b-go">START BOOTH</button>
    <label class="tapbtn alt" for="b-file">Camera not working? Record with the phone’s camera</label>
    <input type="file" id="b-file" accept="video/*" capture="user" hidden>
  </div>
  <div id="flash"></div>
  <div id="hot"></div>
</section>

<!-- ===== REVIEW ===== -->
<section id="s-review" class="screen"><div class="wrap">
  <button class="back" id="r-back">‹ Back</button>
  <div class="top"><h1 style="flex:1">Your video</h1><button class="back" id="r-retake" style="color:var(--red)">Retake</button></div>
  <video class="player" id="r-video" playsinline loop controls></video>
  <button class="btn primary" id="r-share">Share / AirDrop / Save to Photos</button>
  <button class="btn" id="r-download">Download file</button>
  <div class="card lead hidden" id="r-lead">
    <b id="r-leadtitle">Want it sent to you too?</b>
    <input type="email" id="r-email" placeholder="Email" autocomplete="email" inputmode="email">
    <input type="tel" id="r-wa" placeholder="WhatsApp number" inputmode="tel">
    <label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="r-consent" checked> OK to contact me about future events</label>
    <div class="sub" id="r-err" style="color:var(--red)"></div>
    <button class="btn" id="r-savelead">Save my details</button>
  </div>
  <button class="btn primary big" id="r-done">Done</button>
</div></section>

<!-- ===== overlays ===== -->
<div id="pin"><img class="mark" src="icon-192.png" alt=""><h1 id="pin-title">Operator PIN</h1><div class="sub" id="pin-sub"></div>
  <div class="dots" id="pin-dots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pin-pad"></div>
  <button class="back" id="pin-cancel">Cancel</button></div>
<div class="modal" id="modal"><video class="player" id="m-video" playsinline loop controls></video>
  <div class="row" style="width:100%;max-width:420px"><button class="btn" id="m-share">Share</button><button class="btn danger" id="m-del">Delete</button><button class="btn" id="m-close">Close</button></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =====================================================================
   Party Machines Booth — web version.
   One file, no build step, no network needed after the first load.
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(16).slice(2));
const fmtDate = t => new Date(t).toLocaleString([], {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const fmtBytes = b => b > 1e9 ? (b/1e9).toFixed(1)+' GB' : b > 1e6 ? Math.round(b/1e6)+' MB' : Math.round(b/1e3)+' KB';
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms); }
function once(el, ev, ms = 15000) {
  return new Promise((res, rej) => {
    const ok = () => { cleanup(); res(); }, bad = () => { cleanup(); rej(new Error('media error')); };
    const to = setTimeout(() => { cleanup(); rej(new Error('timeout waiting for ' + ev)); }, ms);
    function cleanup() { clearTimeout(to); el.removeEventListener(ev, ok); el.removeEventListener('error', bad); }
    el.addEventListener(ev, ok); el.addEventListener('error', bad);
  });
}

/* ---------------- storage (IndexedDB) ---------------- */
const DB = (() => {
  let db;
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('pmbooth', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('kv');
      d.createObjectStore('events', { keyPath: 'id' });
      d.createObjectStore('clips', { keyPath: 'id' }).createIndex('eventId', 'eventId');
      d.createObjectStore('assets', { keyPath: 'id' });
    };
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
  const tx = (store, mode, fn) => new Promise((res, rej) => {
    const t = db.transaction(store, mode); const r = fn(t.objectStore(store));
    t.oncomplete = () => res(r && r.result); t.onerror = t.onabort = () => rej(t.error);
  });
  return {
    open,
    get: (s, k) => tx(s, 'readonly', st => st.get(k)),
    put: (s, v, k) => tx(s, 'readwrite', st => k === undefined ? st.put(v) : st.put(v, k)),
    del: (s, k) => tx(s, 'readwrite', st => st.delete(k)),
    all: s => tx(s, 'readonly', st => st.getAll()),
    byEvent: id => tx('clips', 'readonly', st => st.index('eventId').getAll(id)),
  };
})();

/* ---------------- settings ---------------- */
const DEFAULTS = {
  clipLength: 12, countdown: 3, facing: 'user', framing: 'wide', outputWidth: 720, keepOriginals: false,
  motionOn: true, sensitivity: 0.5, motionDelay: 2, cooldown: 6, showBack: true, overlayFit: 'cover',
  effect: 'ramp', slowStart: 0.35, slowEnd: 0.7, slowSpeed: 0.4, outroSpeed: 1.4, boomerangSec: 1.5,
  logoCorner: 'br', logoScale: 0.22, logoOpacity: 0.9,

const Motion = {
  armed: false, testing: false, intensity: 0, holdUntil: 0, streak: 0, onTrigger: null, cfg: null, _h: null,
  async permission() {
    if (typeof DeviceMotionEvent === 'undefined') return false;
    if (typeof DeviceMotionEvent.requestPermission === 'function') { try { return (await DeviceMotionEvent.requestPermission()) === 'granted'; } catch { return false; } }
    return true;
  },
  arm(cfg) {
    this.cfg = cfg; this.disarm(); this.armed = true; this.streak = 0;
    this._h = e => {
      const rr = e.rotationRate, ac = e.acceleration, gv = e.accelerationIncludingGravity;
      const rot = rr ? Math.hypot(rr.alpha || 0, rr.beta || 0, rr.gamma || 0) : 0;
      let acc = ac && ac.x != null ? Math.hypot(ac.x || 0, ac.y || 0, ac.z || 0) : 0;
      if (!(ac && ac.x != null) && gv && this._lg) acc = Math.hypot((gv.x || 0) - this._lg.x, (gv.y || 0) - this._lg.y, (gv.z || 0) - this._lg.z);
      if (gv) this._lg = { x: gv.x || 0, y: gv.y || 0, z: gv.z || 0 };
      const rotThr = 80 - this.cfg.sensitivity * 72;                     // deg/s: 8 (very sensitive) … 80
      const accThr = (0.5 - this.cfg.sensitivity * 0.45) * 9.81;         // m/s²
      const raw = Math.max(rot / rotThr, acc / accThr);
      this.intensity = Math.max(raw, this.intensity * 0.92);
      if (raw >= 1) this.streak++; else this.streak = 0;
      if (this.streak >= 4 && performance.now() > this.holdUntil && this.onTrigger) { this.streak = 0; this.onTrigger(); }
    };
    window.addEventListener('devicemotion', this._h);
  },
  disarm() { this.armed = false; if (this._h) window.removeEventListener('devicemotion', this._h); this._h = null; this.intensity = 0; },
  hold(ms) { this.holdUntil = performance.now() + ms; this.streak = 0; },
};

function buildOverlay(W, H, border, logo, cfg) {
  if (!border && !logo) return null;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
  if (border) {
    if (cfg.overlayFit === 'fill') g.drawImage(border, 0, 0, W, H);
    else { const s = (cfg.overlayFit === 'contain' ? Math.min : Math.max)(W / border.width, H / border.height); const w = border.width * s, h = border.height * s; g.drawImage(border, (W - w) / 2, (H - h) / 2, w, h); }
  }
  if (logo) {
    const w = W * clamp(cfg.logoScale, .03, 1), h = w * logo.height / logo.width, m = W * .04;
    const pos = { tl: [m, m], tr: [W - w - m, m], bl: [m, H - h - m], br: [W - w - m, H - h - m], c: [(W - w) / 2, (H - h) / 2] }[cfg.logoCorner] || [W - w - m, H - h - m];
    g.globalAlpha = clamp(cfg.logoOpacity, 0, 1); g.drawImage(logo, pos[0], pos[1], w, h); g.globalAlpha = 1;
  }
  return cv;
}

  if (navigator.vibrate) navigator.vibrate(60);
  if (S.pinHash) { if (!(await pinPrompt('Operator PIN', 'Enter your PIN to leave the booth.', verifyPin))) return; }
  else if (!confirm('Leave the booth?')) return;
  stopBooth(); localStorage.removeItem('kiosk'); openHub(EV.id);
}

/* ---------------- review ---------------- */
let CLIP = null, CLIP_URL = null;
const clipFile = (clip, ev = EV, n = '') => new File([clip.processed], `${ev ? baseName(ev) : 'party-machine'}-${clip.id.slice(0, 6)}${n}.${extOf(clip.type)}`, { type: clip.type });
function openReview(clip) {
  CLIP = clip; if (CLIP_URL) URL.revokeObjectURL(CLIP_URL); CLIP_URL = URL.createObjectURL(clip.processed);
  const v = $('#r-video'); v.src = CLIP_URL; v.play().catch(() => {});
  const cfg = EV.settings; $('#r-lead').classList.toggle('hidden', !cfg.leadOn);
  $('#r-leadtitle').textContent = cfg.leadRequired ? 'Where should we send it?' : 'Want it sent to you too? (optional)';
  ['#r-email', '#r-wa'].forEach(s => $(s).value = ''); $('#r-err').textContent = ''; $('#r-savelead').textContent = 'Save my details'; $('#r-savelead').disabled = false; CLIP._leadSaved = false;
  $('#r-done').disabled = false; show('review');
}
async function logDelivery(kind) { if (!CLIP || CLIP.deliveries.some(d => d.kind === kind)) return; CLIP.deliveries.push({ kind, at: Date.now() }); await DB.put('clips', stripTmp(CLIP)); }
const stripTmp = c => { const { _leadSaved, ...rest } = c; return rest; };
$('#r-share').onclick = async () => { if (await shareFiles([clipFile(CLIP)], 'Your Party Machines video')) logDelivery('share'); else { download(clipFile(CLIP), clipFile(CLIP).name); logDelivery('download'); } };
$('#r-download').onclick = () => { const f = clipFile(CLIP); download(f, f.name); logDelivery('download'); };
$('#r-savelead').onclick = async () => {
  const email = $('#r-email').value.trim(), wa = $('#r-wa').value.trim();
  if (!email && !wa) { $('#r-err').textContent = 'Add an email or a WhatsApp number.'; return; }
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { $('#r-err').textContent = 'Please enter a valid email address.'; return; }
  CLIP.lead = { email: email || null, whatsapp: wa || null, consent: $('#r-consent').checked, at: Date.now() }; CLIP._leadSaved = true;
  await DB.put('clips', stripTmp(CLIP)); $('#r-err').textContent = ''; $('#r-savelead').textContent = 'Saved ✓'; $('#r-savelead').disabled = true; toast('Saved');
};
$('#r-back').onclick = () => $('#r-done').click();
$('#r-done').onclick = () => {
  if (EV.settings.leadOn && EV.settings.leadRequired && !CLIP._leadSaved) { $('#r-err').textContent = 'Please add your details first.'; return; }
  $('#r-video').pause(); show('booth'); afterReview();
};
$('#r-retake').onclick = async () => { if (!confirm('Delete this video and retake?')) return; await DB.del('clips', CLIP.id); EV.clipCount = Math.max(0, EV.clipCount - 1); await DB.put('events', EV); $('#r-video').pause(); show('booth'); afterReview(); };
function afterReview() { if (B.stream) resumeWaiting(); else { bstatus(''); bphase('resume'); } }
function resumeWaiting() { bphase('waiting'); Motion.hold(EV.settings.cooldown * 1000); setProg(0); }

/* ---------------- videos (per event) ---------------- */
let CUR_CLIPS = [];
$('#v-back').onclick = () => openHub(CUR.id);
async function openVideos() {
  const id = CUR.id; CUR_CLIPS = (await DB.byEvent(id)).sort((a, b) => a.createdAt - b.createdAt);
  $('#ev-title').textContent = CUR.name; $('#ev-sub').textContent = `${CUR_CLIPS.length} videos · ${fmtDate(CUR.createdAt)}`;
  const n = CUR_CLIPS.length, batches = []; for (let i = 0; i < n; i += 5) batches.push(CUR_CLIPS.slice(i, i + 5));
  const a = $('#ev-actions'); a.innerHTML = `<h2 style="margin:0">Save &amp; export</h2>
    ${batches.map((b, i) => `<button class="btn primary" data-batch="${i}">Save to Photos — videos ${i * 5 + 1}–${i * 5 + b.length}</button>`).join('') || '<div class="sub">No videos yet. Go back and tap Start recording.</div>'}
    ${n ? '<div class="sub">Pick “Save Video” in the share sheet. iPhone shares a few videos at a time, so there is one button per batch.</div>' : ''}
    <button class="btn" id="ev-zip" ${n ? '' : 'disabled'}>Export all videos (.zip)</button>
    <button class="btn" id="ev-csv" ${CUR_CLIPS.some(c => c.lead) ? '' : 'disabled'}>Export leads (.csv)</button>`;
  $$('[data-batch]', a).forEach(b => b.onclick = async () => { const files = batches[+b.dataset.batch].map(c => clipFile(c, CUR)); if (await shareFiles(files, CUR.name)) { for (const c of batches[+b.dataset.batch]) { c.deliveries.push({ kind: 'photos', at: Date.now() }); await DB.put('clips', c); } toast('Done'); } else toast('Sharing isn’t available here — use the .zip'); });
  $('#ev-zip').onclick = async () => {
    toast('Packaging…', 8000); const reel = await DB.get('kv', 'reel:' + CUR.id); const base = baseName(CUR);
    const files = CUR_CLIPS.map((c, i) => ({ name: `${String(i + 1).padStart(2, '0')}_${base}.${extOf(c.type)}`, blob: c.processed }));
    if (reel) files.unshift({ name: `00_Highlight_${base}.${extOf(reel.type)}`, blob: reel });
    const zip = await makeZip(files), f = new File([zip], base + '_videos.zip', { type: 'application/zip' });
    if (!(await shareFiles([f], CUR.name))) download(f, f.name);
  };
  $('#ev-csv').onclick = () => {
    const q = s => /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    const rows = CUR_CLIPS.filter(c => c.lead).map(c => [q(c.lead.email || ''), q(c.lead.whatsapp || ''), c.lead.consent, new Date(c.lead.at).toISOString(), c.id].join(','));
    const f = new File([['email,whatsapp,consent_marketing,captured_at,clip_id', ...rows].join('\n')], baseName(CUR) + '_leads.csv', { type: 'text/csv' });
    shareFiles([f], 'Leads').then(ok => ok || download(f, f.name));
  };
  renderReelBox(); renderGrid(); show('videos');
}
async function renderReelBox() {
  const box = $('#ev-reel'), reel = await DB.get('kv', 'reel:' + CUR.id), can = CUR_CLIPS.length > 0;
  box.innerHTML = (reel ? '<div class="row"><button class="btn primary" id="rl-play">Play reel</button><button class="btn" id="rl-share">Share</button></div>' : '') +
    `<button class="btn" id="rl-build" ${can ? '' : 'disabled'}>${reel ? 'Rebuild' : 'Create'} highlight reel</button><div class="sub" id="rl-msg"></div>`;
  if (reel) { $('#rl-play').onclick = () => openModal({ processed: reel, type: reel.type, reel: true }); $('#rl-share').onclick = async () => { const f = new File([reel], baseName(CUR) + '_highlight.' + extOf(reel.type), { type: reel.type }); if (!(await shareFiles([f], CUR.name))) download(f, f.name); }; }
  $('#rl-build').onclick = async () => {
    const btn = $('#rl-build'); btn.disabled = true; try { await audioCtx().resume(); } catch {}
    try {
      const r = await renderReel(CUR_CLIPS.map(c => c.processed), assetsFor(CUR.settings), { ...DEFAULTS, ...CUR.settings }, p => $('#rl-msg').textContent = 'Building… ' + Math.round(p * 100) + '% — keep this screen open');
      await DB.put('kv', r.blob, 'reel:' + CUR.id); toast('Highlight reel ready'); renderReelBox();
    } catch (e) { $('#rl-msg').textContent = 'Could not build the reel: ' + e.message; btn.disabled = false; }
  };
}
function renderGrid() {
  const g = $('#ev-grid'); g.innerHTML = '';
  CUR_CLIPS.forEach(c => {
    const d = document.createElement('div'); d.className = 'thumb';
    d.innerHTML = (c.thumb ? `<img alt="">` : '') + `<span>${c.duration.toFixed(0)}s${c.lead ? ' ✉' : ''}</span>`;
    if (c.thumb) $('img', d).src = URL.createObjectURL(c.thumb);
    d.onclick = () => openModal(c); g.appendChild(d);
  });
}
let MODAL = null;
function openModal(c) { MODAL = c; const v = $('#m-video'); v.src = URL.createObjectURL(c.processed); $('#modal').classList.add('show'); v.play().catch(() => {}); $('#m-del').classList.toggle('hidden', !!c.reel); }
$('#m-close').onclick = () => { $('#m-video').pause(); $('#modal').classList.remove('show'); };
$('#m-share').onclick = async () => { const f = new File([MODAL.processed], 'party-machine.' + extOf(MODAL.type), { type: MODAL.type }); if (!(await shareFiles([f], 'Party Machines video'))) download(f, f.name); };
$('#m-del').onclick = async () => { if (!confirm('Delete this clip?')) return; await DB.del('clips', MODAL.id); CUR.clipCount = Math.max(0, CUR.clipCount - 1); await DB.put('events', CUR); $('#m-close').onclick(); openVideos(); };

/* ---------------- boot ---------------- */
(async function init() {
  await DB.open(); await loadSettings(); await loadAssets();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update().catch(() => {})).catch(() => {});
    if (navigator.serviceWorker.controller) navigator.serviceWorker.addEventListener('controllerchange', () => { if (!sessionStorage.getItem('swr')) { sessionStorage.setItem('swr', '1'); if (B.phase === 'idle') location.reload(); } });
  }
  document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && B.phase === 'waiting') { try { B.wake = await navigator.wakeLock.request('screen'); } catch {} } });
  const k = localStorage.getItem('kiosk');
  // With a PIN set, a restart mid-event returns to the locked booth. Without a PIN there is nothing to lock,
  // so the app opens on Home with a 'Resume booth' card instead of trapping you.
  if (k && k !== '1' && S.pinHash && await DB.get('events', k)) { enterBooth(k); return; }
  if (k === '1') localStorage.removeItem('kiosk');
  if (S.pinHash) { await pinPrompt('Operator PIN', 'Enter your PIN to open the app.', verifyPin, true); }
  showHome();
})();
window.PM = { renderClip, renderReel, makeZip, makeThumb, openVideo, DEFAULTS, MIME, audioCtx };
</script>
</body>
</html>
